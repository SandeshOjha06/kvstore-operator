---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - datastore.core.systems
  resources:
  - kvstores
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - datastore.core.systems
  resources:
  - kvstores/finalizers
  verbs:
  - update
- apiGroups:
  - datastore.core.systems
  resources:
  - kvstores/status
  verbs:
  - get
  - patch
  - update
